<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Management System account to access courses and resources.">
  <title>Login - Management System</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">

  <div class="login-container">
    <!-- Top Purple Badge with letter "M" -->
    <div class="login-brand-badge">M</div>
    <h1 class="login-heading">Welcome Back!</h1>
    <p class="login-subheading">Sign in to continue to your account.</p>

    <!-- Login Card -->
    <div class="login-card">
      <h2 class="login-card-title">Login to your account</h2>
      <p class="login-card-subtitle">Enter your email and password to get started.</p>

      <form id="loginForm">
        <!-- Email Input -->
        <div class="mb-3">
          <label for="emailInput" class="form-label form-label-custom">Email Address</label>
          <input 
            type="email" 
            class="form-control form-control-custom" 
            id="emailInput" 
            placeholder="name@example.com" 
            required
          >
        </div>

        <!-- Password Input -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="passwordInput" class="form-label form-label-custom mb-0">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              class="form-control form-control-custom pe-5" 
              id="passwordInput" 
              placeholder="Enter your password" 
              required
            >
            <button type="button" class="password-toggle-btn" id="togglePassword">Show</button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label text-secondary" for="rememberMe" style="font-size: 0.85rem;">
            Remember me
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-signin mb-3" id="signInBtn">
          Sign In
        </button>

        <!-- Create Account Link -->
        <div class="text-center" style="font-size: 0.85rem; color: #64748b;">
          Don't have an account? <a href="#" style="color: var(--accent-purple); font-weight: 600; text-decoration: none;">Create an account</a>
        </div>
      </form>
    </div>

    <!-- Login Page Footer -->
    <div class="login-footer-text">
      &copy; 2026 My Website. All rights reserved.
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom Logic Script -->
  <script src="script.js"></script>
</body>
</html>
